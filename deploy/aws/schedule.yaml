AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Switches the NakamaDesk server and database off at night to save money: stopped from
  00:00 to about 04:50 IST. Nothing is lost (disks, database and the IP stay); the API and
  the storefront's shop data are unreachable in that window. A separate stack on purpose:
  delete it to run 24 hours again, or set State to DISABLED to pause it.
  See docs/DEPLOY_AWS.md, "Cost and size".

Parameters:
  InstanceId:
    Type: String
    Description: The API server (stack output InstanceId of the nakama stack).
  DbInstanceId:
    Type: String
    Description: The database identifier (the part of the stack output DbEndpoint before the first dot).
  State:
    Type: String
    Default: ENABLED
    AllowedValues: [ENABLED, DISABLED]

Resources:
  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: "sts:AssumeRole"
            Condition:
              StringEquals: { "aws:SourceAccount": !Ref "AWS::AccountId" }
      Policies:
        - PolicyName: stop-start-nakama
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ["ec2:StopInstances", "ec2:StartInstances"]
                Resource: !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/${InstanceId}"
              - Effect: Allow
                Action: ["rds:StopDBInstance", "rds:StartDBInstance"]
                Resource: !Sub "arn:aws:rds:${AWS::Region}:${AWS::AccountId}:db:${DbInstanceId}"

  # Order matters: start the database first (it takes a few minutes), then the server;
  # stop the server first, then the database.
  StopServer:
    Type: AWS::Scheduler::Schedule
    Properties:
      Description: Stop the API server at midnight IST
      ScheduleExpression: cron(0 0 * * ? *)
      ScheduleExpressionTimezone: Asia/Kolkata
      State: !Ref State
      FlexibleTimeWindow: { Mode: "OFF" }
      Target:
        Arn: arn:aws:scheduler:::aws-sdk:ec2:stopInstances
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: !Sub '{"InstanceIds":["${InstanceId}"]}'
        RetryPolicy: { MaximumRetryAttempts: 5, MaximumEventAgeInSeconds: 3600 }

  StopDatabase:
    Type: AWS::Scheduler::Schedule
    Properties:
      Description: Stop the database ten minutes after the server
      ScheduleExpression: cron(10 0 * * ? *)
      ScheduleExpressionTimezone: Asia/Kolkata
      State: !Ref State
      FlexibleTimeWindow: { Mode: "OFF" }
      Target:
        Arn: arn:aws:scheduler:::aws-sdk:rds:stopDBInstance
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: !Sub '{"DbInstanceIdentifier":"${DbInstanceId}"}'
        RetryPolicy: { MaximumRetryAttempts: 5, MaximumEventAgeInSeconds: 3600 }

  StartDatabase:
    Type: AWS::Scheduler::Schedule
    Properties:
      Description: Start the database at 04:30 IST
      ScheduleExpression: cron(30 4 * * ? *)
      ScheduleExpressionTimezone: Asia/Kolkata
      State: !Ref State
      FlexibleTimeWindow: { Mode: "OFF" }
      Target:
        Arn: arn:aws:scheduler:::aws-sdk:rds:startDBInstance
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: !Sub '{"DbInstanceIdentifier":"${DbInstanceId}"}'
        RetryPolicy: { MaximumRetryAttempts: 5, MaximumEventAgeInSeconds: 3600 }

  StartServer:
    Type: AWS::Scheduler::Schedule
    Properties:
      Description: Start the API server at 04:50 IST, after the database is up
      ScheduleExpression: cron(50 4 * * ? *)
      ScheduleExpressionTimezone: Asia/Kolkata
      State: !Ref State
      FlexibleTimeWindow: { Mode: "OFF" }
      Target:
        Arn: arn:aws:scheduler:::aws-sdk:ec2:startInstances
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: !Sub '{"InstanceIds":["${InstanceId}"]}'
        RetryPolicy: { MaximumRetryAttempts: 5, MaximumEventAgeInSeconds: 3600 }
