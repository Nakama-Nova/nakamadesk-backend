AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Switches the NakamaDesk server off at night to save money: stopped from 00:00 to about 05:00
  IST. Nothing is lost (the disk, the database files and the IP stay), but the API and the shop
  data are unreachable in that window. For the server with the database on its own disk; if the
  database is still on RDS, stop it separately. A separate stack on purpose: delete it to run
  24 hours again, or set State to DISABLED to pause it. See docs/DEPLOY_AWS.md, "Cost and size".

Parameters:
  InstanceId:
    Type: String
    Description: The API server (stack output InstanceId of the nakama stack).
  State:
    Type: String
    Default: ENABLED
    AllowedValues: [ENABLED, DISABLED]

Resources:
  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: "sts:AssumeRole"
            Condition:
              StringEquals: { "aws:SourceAccount": !Ref "AWS::AccountId" }
      Policies:
        - PolicyName: stop-start-nakama
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ["ec2:StopInstances", "ec2:StartInstances"]
                Resource: !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/${InstanceId}"

  # The server stops gracefully: Docker stops the containers (Postgres shuts down cleanly) first.
  StopServer:
    Type: AWS::Scheduler::Schedule
    Properties:
      Description: Stop the API server at midnight IST
      ScheduleExpression: cron(0 0 * * ? *)
      ScheduleExpressionTimezone: Asia/Kolkata
      State: !Ref State
      FlexibleTimeWindow: { Mode: "OFF" }
      Target:
        Arn: arn:aws:scheduler:::aws-sdk:ec2:stopInstances
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: !Sub '{"InstanceIds":["${InstanceId}"]}'
        RetryPolicy: { MaximumRetryAttempts: 5, MaximumEventAgeInSeconds: 3600 }

  # A couple of minutes before 05:00, so the shop is open when it opens.
  StartServer:
    Type: AWS::Scheduler::Schedule
    Properties:
      Description: Start the API server at 04:55 IST
      ScheduleExpression: cron(55 4 * * ? *)
      ScheduleExpressionTimezone: Asia/Kolkata
      State: !Ref State
      FlexibleTimeWindow: { Mode: "OFF" }
      Target:
        Arn: arn:aws:scheduler:::aws-sdk:ec2:startInstances
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: !Sub '{"InstanceIds":["${InstanceId}"]}'
        RetryPolicy: { MaximumRetryAttempts: 5, MaximumEventAgeInSeconds: 3600 }
