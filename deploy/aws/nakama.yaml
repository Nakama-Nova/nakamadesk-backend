AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  NakamaDesk API on AWS: one EC2 instance running Caddy, the API and Postgres in Docker, with
  an S3 bucket for photos, 3D models and database dumps. See docs/DEPLOY_AWS.md.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: The VPC to deploy into (the default VPC is fine).
  InstanceSubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: A public subnet for the API instance.
  InstanceType:
    Type: String
    Default: t3.small
    Description: >-
      t3.small (2 GB) runs the API, Caddy and the Postgres container. t3.micro (1 GB) is too
      small for all three. Changing it on a live stack restarts the instance (a few
      minutes): see docs/DEPLOY_AWS.md.
  UbuntuAmi:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id
  CorsOrigins:
    Type: String
    Default: ""
    Description: Storefront origins allowed to call the API from a browser, comma separated.

Resources:
  # ---- secrets: generated by AWS, never pass through a person or the template ----
  DbPassword:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: NakamaDesk Postgres password (letters and digits, safe inside a URL)
      GenerateSecretString:
        PasswordLength: 32
        ExcludePunctuation: true

  AppSecretKey:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: NakamaDesk SECRET_KEY (JWT signing)
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true

  # ---- storage ----
  AppBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain # holds customer files; empty and delete it by hand if you really mean to
    UpdateReplacePolicy: Retain
    Properties:
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }

  # ---- network ----
  ApiSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: NakamaDesk API - HTTP/HTTPS only, no SSH (use SSM Session Manager)
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0, Description: HTTP (Lets Encrypt + redirect) }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: HTTPS }

  # ---- database ----
  # There is no database resource: Postgres runs as the `db` container on the instance (data in
  # a Docker volume, dumped to S3 every 6 hours). It used to be an RDS instance; see
  # docs/DEPLOY_AWS.md, "Removing the old RDS".

  # ---- compute ----
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - { Effect: Allow, Principal: { Service: ec2.amazonaws.com }, Action: "sts:AssumeRole" }
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: nakama-app
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ["s3:GetObject", "s3:PutObject", "s3:DeleteObject"]
                Resource: !Sub "${AppBucket.Arn}/*"
              - Effect: Allow
                Action: ["s3:ListBucket"]
                Resource: !GetAtt AppBucket.Arn
              - Effect: Allow
                Action: ["secretsmanager:GetSecretValue"]
                Resource: [!Ref DbPassword, !Ref AppSecretKey]

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  ApiEip:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc

  ApiInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref UbuntuAmi
      InstanceType: !Ref InstanceType
      SubnetId: !Ref InstanceSubnetId
      SecurityGroupIds: [!Ref ApiSecurityGroup]
      IamInstanceProfile: !Ref InstanceProfile
      MetadataOptions:
        HttpTokens: required
        HttpPutResponseHopLimit: 2 # lets containers reach the instance role
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs: { VolumeSize: 30, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true }
      Tags:
        - { Key: Name, Value: nakama-api }
      UserData:
        Fn::Base64: !Sub
          - |
            #!/bin/bash
            set -euxo pipefail
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y docker.io docker-compose-v2
            snap install aws-cli --classic
            systemctl enable --now docker
            mkdir -p /opt/nakama
            # A new server runs its database in the container from the start (see release.sh).
            touch /opt/nakama/use-local-db
            # Non-secret settings only. Secrets are read from Secrets Manager at deploy time.
            cat > /opt/nakama/aws.env <<'EOF'
            AWS_REGION=${AWS::Region}
            S3_BUCKET=${AppBucket}
            DB_SECRET_ID=${DbPassword}
            APP_SECRET_ID=${AppSecretKey}
            SITE_ADDRESS=${Site}
            CORS_ORIGINS=${CorsOrigins}
            EOF
          - Site: !Join ["", [!Join ["-", !Split [".", !Ref ApiEip]], ".sslip.io"]]

  ApiEipAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      InstanceId: !Ref ApiInstance
      AllocationId: !GetAtt ApiEip.AllocationId

  # Restart the instance on different hardware if AWS reports a system failure.
  ApiRecoverAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Auto-recover the API instance on system status check failure
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed_System
      Dimensions: [{ Name: InstanceId, Value: !Ref ApiInstance }]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions: [!Sub "arn:aws:automate:${AWS::Region}:ec2:recover"]

Outputs:
  ApiUrl:
    Value: !Join ["", ["https://", !Join ["-", !Split [".", !Ref ApiEip]], ".sslip.io"]]
  InstanceId:
    Value: !Ref ApiInstance
  Bucket:
    Value: !Ref AppBucket
