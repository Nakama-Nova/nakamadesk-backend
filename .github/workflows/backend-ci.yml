name: Backend CI

on:
  push:
    branches: [ main, 'feature/*', 'refactor/*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: furnbiz_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/furnbiz_test
      SECRET_KEY: test_secret_key_ci
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Check formatting with black
        run: |
          black --check app tests || (echo "::error::Formatting issues found. Run 'black app tests' locally before pushing or install pre-commit hooks." && exit 1)

      - name: Lint with ruff
        run: |
          ruff check app tests

      - name: Run migrations
        run: |
          alembic upgrade head

      # The timing-based load tests run in their own job below: they measure the speed of
      # a shared CI machine, so they must not decide whether a change (or a deploy) passes.
      - name: Run tests with coverage
        run: |
          pytest --ignore=tests/performance --cov=app --cov-report=term-missing --cov-report=html:reports/coverage             --html=reports/backend-test-report.html --self-contained-html -v

      # Download from the run's "Artifacts" to read the HTML test and coverage reports.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: reports/
          if-no-files-found: ignore

  # Informational: response-time checks (average and 95th percentile) on a shared CI
  # machine vary from run to run. A slow run raises a warning, never a red cross, and
  # never blocks a merge or the deploy that waits for this workflow. Run them locally
  # with `pytest tests/performance` when you want a real measurement.
  load-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: furnbiz_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/furnbiz_test
      SECRET_KEY: test_secret_key_ci
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run load tests
        id: load
        continue-on-error: true
        run: pytest tests/performance -v

      - name: Say so when a load test was too slow
        if: steps.load.outcome == 'failure'
        run: echo "::warning::A load test was slower than its limit on this CI machine. This does not fail the build. See the log above, and rerun locally with 'pytest tests/performance'."

  # Informational for now, like the load tests: a finding raises a warning and never
  # blocks a merge or the deploy that waits for this workflow. Once the first findings
  # are cleared, delete the two `continue-on-error` lines to make them gate.
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Known vulnerabilities in pinned dependencies
        id: audit
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --no-deps --disable-pip

      - name: Say so when a dependency has a known vulnerability
        if: steps.audit.outcome == 'failure'
        run: echo "::warning::pip-audit found a vulnerable dependency. See the log above, then bump the pin in requirements.txt."

      - name: Secrets committed to the repository
        id: secrets
        continue-on-error: true
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.18.4 detect --source /repo --no-banner --redact

      - name: Say so when a secret was found
        if: steps.secrets.outcome == 'failure'
        run: echo "::warning::gitleaks found something that looks like a secret. See the log above; rotate it if it is real."

  # Builds the deployment images and proves the one-VM stack works end to end: the
  # migration job runs, the API answers as a non-root user, and a backup can be
  # restored. The backup goes to a local folder here; production sends it to R2.
  docker:
    runs-on: ubuntu-latest
    env:
      COMPOSE: docker compose -f deploy/compose/docker-compose.yml --env-file deploy/compose/ci.env
      LOCAL_BACKUP: -v /tmp/backups:/backups -e RCLONE_CONFIG_BACKUP_TYPE=local -e BACKUP_REMOTE=backup:/backups

    steps:
      - uses: actions/checkout@v4

      - name: Compose file is valid
        run: $COMPOSE config --quiet

      - name: Build images, run migrations, start the API
        run: $COMPOSE up -d --build api

      - name: API answers its health check
        run: |
          for i in $(seq 1 30); do
            $COMPOSE exec -T api python -c "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health/', timeout=4)" && exit 0
            sleep 2
          done
          $COMPOSE logs api migrate
          exit 1

      - name: Database is at the newest migration, API runs as a non-root user
        run: |
          current="$($COMPOSE exec -T api alembic current)"
          echo "$current"
          echo "$current" | grep -q "(head)"
          test "$($COMPOSE exec -T api id -u)" != "0"

      - name: Back up, then restore the backup into a scratch database
        run: |
          $COMPOSE exec -T db psql -U nakama -d nakama -c "insert into categories(name) values ('ci-backup-check')"
          mkdir -p /tmp/backups
          $COMPOSE run --rm --no-deps $LOCAL_BACKUP backup /scripts/backup.sh
          $COMPOSE run --rm --no-deps $LOCAL_BACKUP backup /scripts/restore-test.sh > /tmp/restore.log
          cat /tmp/restore.log
          grep -q "categories  backup=1  live=1" /tmp/restore.log

      - name: Logs on failure
        if: failure()
        run: $COMPOSE logs --no-color

      - name: Stop
        if: always()
        run: $COMPOSE down -v
