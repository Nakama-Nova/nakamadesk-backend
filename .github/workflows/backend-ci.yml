name: Backend CI

on:
  push:
    branches: [ main, 'feature/*', 'refactor/*' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: furnbiz_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/furnbiz_test
      SECRET_KEY: test_secret_key_ci
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Check formatting with black
        run: |
          black --check app tests || (echo "::error::Formatting issues found. Run 'black app tests' locally before pushing or install pre-commit hooks." && exit 1)

      - name: Lint with ruff
        run: |
          ruff check app tests

      - name: Run migrations
        run: |
          alembic upgrade head

      - name: Run tests with coverage
        run: |
          pytest --cov=app --cov-report=term-missing -v
